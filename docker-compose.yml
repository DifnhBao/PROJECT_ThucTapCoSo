x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-database: &database
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: ${MYSQL_DATABASE:-tunetrek_demo}
  DB_USER: ${DB_USER:?Set DB_USER}
  DB_PASS: ${DB_PASS:?Set DB_PASS}
services:
  db:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tunetrek_demo}
      MYSQL_USER: ${DB_USER:?Set DB_USER}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:?Set MIGRATION_DB_USER}
      MIGRATION_DB_PASS: ${MIGRATION_DB_PASS:?Set MIGRATION_DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/10-app-permissions.sh:/docker-entrypoint-initdb.d/10-app-permissions.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 40
    networks: [database]
    logging: *logging
    mem_limit: 768m
  migrate:
    build: {context: ./Server, target: migration}
    init: true
    environment:
      <<: *database
      NODE_ENV: production
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:?Set MIGRATION_DB_USER}
      MIGRATION_DB_PASS: ${MIGRATION_DB_PASS:?Set MIGRATION_DB_PASS}
    depends_on:
      db: {condition: service_healthy}
    networks: [database]
    read_only: true
    tmpfs: [/tmp:size=32m]
    logging: *logging
    restart: "no"
  api:
    build: {context: ./Server, target: runtime}
    init: true
    environment:
      <<: *database
      NODE_ENV: ${APP_NODE_ENV:-development}
      PORT: "5000"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?Set CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?Set CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?Set CLOUDINARY_API_SECRET}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      migrate: {condition: service_completed_successfully}
      db: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /app/public/uploads/temp:size=32m,uid=1000,gid=1000,mode=0700
    volumes: [api_runtime:/app/.runtime]
    networks: [database, frontend]
    logging: *logging
    mem_limit: 384m
  web:
    build:
      context: ./UI
      target: runtime
      args: {API_INTERNAL_URL: "http://api:5000"}
    init: true
    depends_on:
      api: {condition: service_healthy}
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /app/.next/cache:size=64m,uid=1000,gid=1000
    networks: [frontend]
    logging: *logging
    mem_limit: 512m
  seed:
    profiles: [demo]
    build: {context: ./Server, target: runtime}
    init: true
    environment:
      <<: *database
      NODE_ENV: development
      DEMO_SEED_ALLOWED: "yes"
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-}
      DEMO_LOCAL_MEDIA: "yes"
    command: ["node", "scripts/db-seed.cjs", "demo"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [database]
    read_only: true
    logging: *logging
    restart: "no"
volumes:
  mysql_data:
  api_runtime:
networks:
  database: {internal: true}
  frontend:
