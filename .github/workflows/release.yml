name: Build release images
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character commit SHA already green on main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-images
  cancel-in-progress: false
jobs:
  policy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Only dispatch from main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '22.19.0'}
      - run: node scripts/ci/release-policy.cjs
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
  images:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Build and push immutable source tags
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          REGISTRY_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/docker-release
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          test "${#RELEASE_SHA}" = 40
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --target runtime -t "ghcr.io/$owner/tunetrek-api:$RELEASE_SHA" Server
          docker build --target migration -t "ghcr.io/$owner/tunetrek-migrate:$RELEASE_SHA" Server
          docker build --target runtime --build-arg API_INTERNAL_URL=http://api:5000 -t "ghcr.io/$owner/tunetrek-web:$RELEASE_SHA" UI
          for service in api migrate web; do
            image="ghcr.io/$owner/tunetrek-$service:$RELEASE_SHA"
            docker push "$image"
            docker image inspect "$image" --format '{{json .RepoDigests}}' > "$service-digest.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-image-digests
          path: '*-digest.json'
          retention-days: 30
# No automatic deploy or GitHub release tag. Follow docs/RELEASE_VI.md after staging smoke.
