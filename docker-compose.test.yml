services:
  mysql-test:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    environment:
      MYSQL_ROOT_PASSWORD: ${TEST_MYSQL_ROOT_PASSWORD:?Set a disposable test root password}
      MYSQL_DATABASE: ${TEST_DB_NAME:?Set isolated test database name}
      MYSQL_USER: ${TEST_DB_USER:?Set test runner account}
      MYSQL_PASSWORD: ${TEST_DB_PASS:?Set test runner password}
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 40
    # No application volume or SQL dump mounts. Data belongs only to this test container.
